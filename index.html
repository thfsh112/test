<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22313f">
<title>小計數器 PWA 診斷</title>
<link rel="manifest" href="./manifest.webmanifest?v=20261003-02">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=20261003-02">
<link rel="apple-touch-icon" href="./icon-192.png?v=20261003-02">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小計數器">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f1e8;color:#22313f;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;padding:22px}
.wrap{max-width:620px;margin:auto}
.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:16px;box-shadow:0 10px 30px #22313f18}
h1{margin:0 0 8px;font-size:26px}.muted{color:#687680;line-height:1.6}
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px}
#count{font-size:56px;font-weight:900}
button{border:0;border-radius:14px;padding:14px 16px;font:inherit;font-weight:800;background:#22313f;color:#fff}
button.alt{background:#ded8cc;color:#22313f}
#installBtn{width:100%;margin-top:14px;background:#b36f56}
#installBtn:disabled{opacity:.45}
.grid{display:grid;grid-template-columns:1fr auto;gap:9px 12px;font-size:14px;align-items:start}
.grid b{word-break:break-word}.ok{color:#087f5b}.bad{color:#c92a2a}.wait{color:#9c6b00}
pre{white-space:pre-wrap;word-break:break-word;background:#f6f6f4;border-radius:12px;padding:12px;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <h1>小計數器 PWA 診斷</h1>
    <p class="muted">這版直接使用「匿名信箱」已成功安裝過的同一組 192/512 圖示，並把安裝條件逐項顯示。</p>
    <div class="counter">
      <button id="minus" class="alt">－1</button>
      <div id="count">0</div>
      <button id="plus">＋1</button>
    </div>
    <button id="installBtn" disabled>等待 Chrome 提供安裝事件</button>
  </section>

  <section class="card">
    <h2>安裝診斷</h2>
    <div class="grid">
      <span>安全環境</span><b id="secure">—</b>
      <span>Manifest</span><b id="manifest">—</b>
      <span>192 圖示</span><b id="icon192">—</b>
      <span>512 圖示</span><b id="icon512">—</b>
      <span>Service Worker</span><b id="sw">—</b>
      <span>頁面被 SW 控制</span><b id="controller">—</b>
      <span>beforeinstallprompt</span><b id="bip" class="wait">尚未觸發</b>
      <span>App 模式</span><b id="standalone">—</b>
      <span>安裝結果</span><b id="result">尚未安裝</b>
    </div>
    <pre id="detail"></pre>
  </section>
</div>
<script>
const $=id=>document.getElementById(id);
let value=Number(localStorage.getItem('tiny-counter')||0);
let installPrompt=null;
function renderCounter(){ $('count').textContent=value;localStorage.setItem('tiny-counter',String(value)); }
$('minus').onclick=()=>{value--;renderCounter()};
$('plus').onclick=()=>{value++;renderCounter()};
renderCounter();

function setState(id,text,ok){
  const el=$(id); el.textContent=text;
  el.className=ok===true?'ok':ok===false?'bad':'wait';
}
function isStandalone(){
  return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
}
async function checkImage(id,url,w,h){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{const ok=img.naturalWidth===w&&img.naturalHeight===h;setState(id,img.naturalWidth+'×'+img.naturalHeight,ok);resolve(ok)};
    img.onerror=()=>{setState(id,'載入失敗',false);resolve(false)};
    img.src=url;
  });
}
async function diagnostics(){
  setState('secure',String(isSecureContext),isSecureContext);
  setState('standalone',String(isStandalone()),isStandalone());

  try{
    const r=await fetch('./manifest.webmanifest?v=20261003-02',{cache:'no-store'});
    const m=await r.json();
    const ok=r.ok&&m.name&&m.start_url&&m.scope&&m.display;
    setState('manifest',(r.status+' · '+(r.headers.get('content-type')||'no content-type')),!!ok);
    $('detail').textContent=
      'URL: '+location.href+'\n'+
      'Manifest start_url: '+m.start_url+'\n'+
      'Manifest scope: '+m.scope+'\n'+
      'Manifest display: '+m.display+'\n'+
      'User agent: '+navigator.userAgent;
  }catch(e){
    setState('manifest','讀取失敗',false);
    $('detail').textContent=String(e);
  }

  await checkImage('icon192','./icon-192.png?v=20261003-02',192,192);
  await checkImage('icon512','./icon-512.png?v=20261003-02',512,512);

  if(!('serviceWorker' in navigator)){
    setState('sw','不支援',false);
    setState('controller','無',false);
    return;
  }
  try{
    const reg=await navigator.serviceWorker.register('/test/service-worker.js?v=20261003-02',{scope:'/test/',updateViaCache:'none'});
    await navigator.serviceWorker.ready;
    await reg.update().catch(()=>{});
    setState('sw',reg.active?'active':'registered',!!reg.active);
    setState('controller',navigator.serviceWorker.controller?.scriptURL||'尚未控制',!!navigator.serviceWorker.controller);
  }catch(e){
    setState('sw',String(e?.message||e),false);
  }
}
window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  installPrompt=event;
  setState('bip','已觸發',true);
  $('installBtn').disabled=false;
  $('installBtn').textContent='安裝 App';
});
window.addEventListener('appinstalled',()=>{
  setState('result','appinstalled 已觸發',true);
  $('installBtn').disabled=true;
});
navigator.serviceWorker?.addEventListener('controllerchange',()=>{
  setState('controller',navigator.serviceWorker.controller?.scriptURL||'尚未控制',!!navigator.serviceWorker.controller);
});
$('installBtn').onclick=async()=>{
  if(!installPrompt)return;
  const p=installPrompt;
  installPrompt=null;
  $('installBtn').disabled=true;
  await p.prompt();
  const choice=await p.userChoice.catch(()=>null);
  setState('result',choice?.outcome||'unknown',choice?.outcome==='accepted');
};
diagnostics();
setTimeout(()=>{
  if(!installPrompt&&!isStandalone())setState('bip','5 秒內未觸發',false);
},5000);
</script>
</body>
</html>
