<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#22313f">
  <title>小計數器</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20261003-01">
  <link rel="icon" href="./icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    *{box-sizing:border-box}
    html,body{min-height:100%}
    body{
      margin:0;display:grid;place-items:center;
      font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;
      background:#f5f1e8;color:#22313f;padding:24px
    }
    .card{
      width:min(420px,100%);background:#fff;border-radius:28px;padding:28px;
      box-shadow:0 18px 55px rgba(34,49,63,.12);text-align:center
    }
    .icon{
      width:84px;height:84px;margin:0 auto 18px;border-radius:22px;
      display:grid;place-items:center;background:#22313f;color:#f5f1e8;
      font-size:48px;font-weight:800
    }
    h1{margin:0 0 8px;font-size:28px}
    .hint{margin:0 0 24px;color:#64727d;line-height:1.6}
    .count{font-size:76px;font-weight:800;line-height:1;margin:20px 0 26px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button{
      border:0;border-radius:16px;padding:16px;font:inherit;font-weight:800;
      background:#22313f;color:#fff;cursor:pointer
    }
    button.secondary{background:#e7e2d8;color:#22313f}
    #installBtn{width:100%;margin-top:12px;background:#b36f56}
    #installBtn[hidden]{display:none}
    .status{font-size:13px;color:#73808a;margin-top:16px;min-height:20px}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">+</div>
    <h1>小計數器</h1>
    <p class="hint">一個最小化的 PWA 測試 App。數字會保存在這台裝置。</p>
    <div id="count" class="count">0</div>
    <div class="row">
      <button id="minus" class="secondary" type="button">－ 1</button>
      <button id="plus" type="button">＋ 1</button>
    </div>
    <button id="installBtn" type="button" hidden>安裝 App</button>
    <div id="status" class="status">正在準備 PWA…</div>
  </main>

  <script>
    const countEl=document.getElementById('count');
    const statusEl=document.getElementById('status');
    const installBtn=document.getElementById('installBtn');
    let value=Number(localStorage.getItem('tiny-counter')||0);
    let installPrompt=null;

    function render(){
      countEl.textContent=String(value);
      localStorage.setItem('tiny-counter',String(value));
    }
    document.getElementById('plus').onclick=()=>{value++;render()};
    document.getElementById('minus').onclick=()=>{value--;render()};
    render();

    function standalone(){
      return matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
    }

    window.addEventListener('beforeinstallprompt',event=>{
      event.preventDefault();
      installPrompt=event;
      installBtn.hidden=false;
      statusEl.textContent='Chrome 已判定這個 App 可以安裝。';
    });

    installBtn.addEventListener('click',async()=>{
      if(!installPrompt)return;
      const p=installPrompt;
      installPrompt=null;
      installBtn.hidden=true;
      await p.prompt();
      const result=await p.userChoice.catch(()=>null);
      statusEl.textContent=result?.outcome==='accepted'?'已送出安裝。':'已取消安裝。';
    });

    window.addEventListener('appinstalled',()=>{
      installBtn.hidden=true;
      statusEl.textContent='App 已安裝。';
    });

    (async()=>{
      if(standalone()){
        statusEl.textContent='目前正在獨立 App 模式執行。';
        return;
      }
      if(!('serviceWorker' in navigator)){
        statusEl.textContent='此瀏覽器不支援 Service Worker。';
        return;
      }
      try{
        const reg=await navigator.serviceWorker.register('/test/service-worker.js?v=20261003-01',{scope:'/test/',updateViaCache:'none'});
        await navigator.serviceWorker.ready;
        await reg.update().catch(()=>{});
        if(!installPrompt)statusEl.textContent='PWA 已就緒，等待瀏覽器提供安裝。';
      }catch(error){
        statusEl.textContent='Service Worker 啟動失敗：'+(error?.message||error);
      }
    })();
  </script>
</body>
</html>
